<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    html, body { margin: 0; padding: 0; background: #000; height: 100%; }
    #player { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var player;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: 'VIDEO_ID_PLACEHOLDER',
        playerVars: {
          'playsinline': 1,
          'autoplay': 1,
          'rel': 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      if (window.AndroidBridge) {
        AndroidBridge.onReady();
      }
    }

    function onPlayerStateChange(event) {
      if (window.AndroidBridge) {
        AndroidBridge.onStateChange(event.data);
      }
    }

    // Functions callable from Android via evaluateJavascript()
    function ytPlay() { if (player && player.playVideo) player.playVideo(); }
    function ytPause() { if (player && player.pauseVideo) player.pauseVideo(); }
    function ytSeekTo(seconds) { if (player && player.seekTo) player.seekTo(seconds, true); }
  </script>
</body>
</html>
